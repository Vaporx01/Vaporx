<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAPORX - Жидкости</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💨</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: #0f0f14; color: #eee; min-height: 100vh; }
header {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  padding: 20px 40px; display: flex; justify-content: space-between;
  align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #e94560;
}
.logo {
  font-size: 26px; font-weight: bold; color: #e94560;
  cursor: pointer; user-select: none; display: flex;
  align-items: center; gap: 12px; transition: 0.3s;
}
.logo:hover { opacity: 0.85; }
.logo img {
  height: 40px; width: 40px; object-fit: cover;
  border-radius: 8px; background: #0f0f14;
}
.logo-text { color: #e94560; letter-spacing: 2px; }
.header-actions { display: flex; gap: 10px; }
.btn {
  color: white; border: none; padding: 10px 20px;
  border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s;
}
.cart-btn { background: #e94560; }
.cart-btn:hover { background: #ff5c77; transform: scale(1.05); }
.container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
h2 { margin-bottom: 25px; color: #fff; border-left: 4px solid #e94560; padding-left: 12px; }
.status {
  padding: 12px 18px; background: #1a1a2e; border-radius: 8px;
  margin-bottom: 20px; font-size: 14px; color: #999;
  border-left: 3px solid #e94560;
}
.status.ok { border-left-color: #2ecc71; color: #2ecc71; }
.status.err { border-left-color: #e74c3c; color: #e74c3c; }
 .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
.card {
  background: #1a1a2e; border-radius: 14px; overflow: hidden;
  transition: 0.3s; border: 1px solid #2a2a44;
  display: flex; flex-direction: column; position: relative;
}
.card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(233,69,96,0.3); border-color: #e94560; }
.card-img {
  height: 200px; display: flex; align-items: center; justify-content: center;
  font-size: 70px; background: linear-gradient(135deg, #16213e, #0f3460);
  overflow: hidden;
}
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.card-title { font-size: 17px; margin-bottom: 6px; color: #fff; }
.card-desc { font-size: 13px; color: #999; margin-bottom: 10px; }
.card-price { font-size: 20px; color: #e94560; font-weight: bold; margin-bottom: 12px; }
.add-btn {
  background: #e94560; color: white; border: none; padding: 10px;
  border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s;
  margin-top: auto;
}
.add-btn:hover { background: #ff5c77; }
.delete-btn {
  position: absolute; top: 10px; right: 10px;
  background: rgba(231,76,60,0.9); color: white; border: none;
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  font-size: 16px; z-index: 10; transition: 0.2s;
}
.delete-btn:hover { background: #e74c3c; transform: scale(1.1); }
.cart-panel {
  position: fixed; right: -420px; top: 0; width: 400px; height: 100%;
  background: #1a1a2e; box-shadow: -5px 0 30px rgba(0,0,0,0.7);
  transition: 0.4s; z-index: 200; display: flex; flex-direction: column;
  border-left: 2px solid #e94560;
}
.cart-panel.open { right: 0; }
.cart-header {
  padding: 20px; background: #16213e; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 1px solid #2a2a44;
}
.close-btn { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; }
.cart-items { flex: 1; overflow-y: auto; padding: 15px; }
.cart-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px; background: #0f0f14; border-radius: 8px; margin-bottom: 10px;
}
.cart-item-info { font-size: 14px; }
.cart-item-info small { color: #999; display: block; margin-top: 3px; }
.remove-btn { background: #e94560; color: white; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.cart-footer { padding: 20px; border-top: 1px solid #2a2a44; background: #16213e; }
.total { font-size: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; }
.total span:last-child { color: #e94560; font-weight: bold; }
.checkout-btn {
  width: 100%; padding: 14px; background: #e94560; color: white;
  border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s;
}
.checkout-btn:hover { background: #ff5c77; }
.checkout-btn:disabled { background: #444; cursor: not-allowed; }
.empty { text-align: center; color: #666; padding: 40px 0; }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  opacity: 0; pointer-events: none; transition: 0.3s; z-index: 150;
}
.overlay.show { opacity: 1; pointer-events: all; }
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center;
  z-index: 500; padding: 20px; overflow-y: auto;
}
.modal.show { display: flex; }
.modal-box {
  background: #1a1a2e; border-radius: 16px; padding: 30px;
  width: 100%; max-width: 500px; border: 1px solid #2a2a44;
  max-height: 90vh; overflow-y: auto;
}
.modal-box h3 { color: #e94560; margin-bottom: 20px; font-size: 22px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; color: #b5b9c4; font-size: 14px; }
.form-group input, .form-group textarea {
  width: 100%; padding: 12px; background: #0f0f14; border: 1px solid #2a2a44;
  border-radius: 8px; color: #fff; font-size: 15px; transition: 0.2s;
}
.form-group input:focus, .form-group textarea:focus {
  outline: none; border-color: #e94560;
}
.form-group input[type="file"] { padding: 8px; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; }
.form-actions button {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s;
}
.btn-primary { background: #e94560; color: white; }
.btn-primary:hover { background: #ff5c77; }
.btn-primary:disabled { background: #444; cursor: not-allowed; }
.btn-secondary { background: #3a3a5a; color: white; }
.btn-secondary:hover { background: #4a4a6a; }
.tabs {
  display: flex; gap: 8px; margin-bottom: 20px;
  border-bottom: 1px solid #2a2a44; padding-bottom: 10px;
}
.tab {
  padding: 8px 16px; background: none; border: none;
  color: #999; cursor: pointer; font-size: 14px;
  border-radius: 6px; transition: 0.2s;
}
.tab.active { background: #e94560; color: white; }
.tab:hover:not(.active) { background: #2a2a44; color: #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #e94560; color: white; padding: 14px 28px; border-radius: 10px;
  transition: 0.3s; z-index: 999; opacity: 0; max-width: 90%;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { background: #2ecc71; color: #0f0f14; }
.toast.error { background: #e74c3c; }
.loader { text-align: center; padding: 60px; color: #666; font-size: 16px; }
.preview-img {
  width: 100%; max-height: 200px; object-fit: cover;
  border-radius: 8px; margin-top: 10px; display: none;
}
.logo-preview {
  width: 80px; height: 80px; object-fit: cover;
  border-radius: 10px; margin-top: 10px; display: none;
  background: #0f0f14; border: 1px solid #2a2a44;
}
@media (max-width: 500px) {
  .cart-panel { width: 100%; right: -100%; }
  header { padding: 15px 20px; gap: 10px; }
  .logo { font-size: 18px; }
  .logo img { height: 32px; width: 32px; }
}
</style>
</head>
<body>
<header>
  <div class="logo" id="shopLogo" title="">
    <img id="logoImg" style="display:none;" alt="logo">
    <span class="logo-text">VAPORX</span>
  </div>
  <div class="header-actions">
    <button class="btn cart-btn" onclick="toggleCart()">🛒 Корзина (<span id="cartCount">0</span>)</button>
  </div>
</header>

<div class="container">
  <h2>Жидкости для вейпа</h2>
  <div class="status" id="status">Подключение к Firebase...</div>
  <div class="grid" id="products">
    <div class="loader">⏳ Загрузка товаров...</div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>Корзина</h3>
    <button class="close-btn" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="total"><span>Итого:</span><span id="cartTotal">0 MDL</span></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Оформить заказ</button>
  </div>
</div>
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>🔐 Вход в админку</h3>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="adminPassword" placeholder="Введите пароль" onkeydown="if(event.key==='Enter')checkPassword()">
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal('loginModal')">Отмена</button>
      <button class="btn-primary" onclick="checkPassword()">Войти</button>
    </div>
  </div>
</div>

<div class="modal" id="adminModal">
  <div class="modal-box">
    <h3>⚙️ Админ-панель</h3>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('tab-product', this)">📦 Товар</button>
      <button class="tab" onclick="switchTab('tab-logo', this)">🖼️ Логотип</button>
    </div>
    <div class="tab-content active" id="tab-product">
      <div class="form-group">
        <label>Название *</label>
        <input type="text" id="pName" placeholder="Ice Cool Mint">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <input type="text" id="pDesc" placeholder="Ментол • 30мл • 20мг">
      </div>
      <div class="form-group">
        <label>Цена, MDL *</label>
        <input type="number" id="pPrice" placeholder="250" min="0">
      </div>
      <div class="form-group">
        <label>Фото товара с устройства</label>
        <input type="file" id="pImage" accept="image/*" onchange="previewImage(event)">
        <img id="preview" class="preview-img">
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="closeModal('adminModal')">Закрыть</button>
        <button class="btn-primary" id="saveBtn" onclick="saveProduct()">💾 Добавить товар</button>
      </div>
    </div>
    <div class="tab-content" id="tab-logo">
      <div class="form-group">
        <label>Логотип магазина (PNG, JPG)</label>
        <input type="file" id="logoFile" accept="image/*" onchange="previewLogo(event)">
        <img id="logoPreview" class="logo-preview">
        <small style="color:#666;display:block;margin-top:6px;">Рекомендуется квадратное фото ~200×200px</small>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="removeLogo()">🗑 Убрать</button>
        <button class="btn-primary" id="saveLogoBtn" onclick="saveLogo()">💾 Сохранить логотип</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Готово</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, deleteDoc, doc,
  serverTimestamp, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCQe2EbDu2fVV5fskFw1X90eH0MW_GjtM",
  authDomain: "vaporx-ffb81.firebaseapp.com",
  projectId: "vaporx-ffb81",
  storageBucket: "vaporx-ffb81.firebasestorage.app",
  messagingSenderId: "575300685167",
  appId: "1:575300685167:web:2b5324d1ba9d162a0d6c9a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD = 'pip789';
let isAdmin = sessionStorage.getItem('isAdmin') === '1';
let products = [];
let cart = JSON.parse(localStorage.getItem('vape_cart') || '[]');
let logoClickCount = 0;
let logoClickTimer = null;
let compressedImageBase64 = '';
let newLogoBase64 = '';

document.getElementById('shopLogo').addEventListener('click', () => {
  logoClickCount++;
  clearTimeout(logoClickTimer);
  if (logoClickCount >= 3) {
    logoClickCount = 0;
    openAdmin();
    return;
  }
  logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 800);
});

function setStatus(text, type = '') {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status ' + type;
}

function compressImage(file, maxSize = 800, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function loadLogo() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'logo'));
    if (snap.exists() && snap.data().imageUrl) {
      applyLogo(snap.data().imageUrl);
    }
  } catch (e) {
    console.warn('Логотип не загружен:', e);
  }
}

function applyLogo(dataUrl) {
  const img = document.getElementById('logoImg');
  img.src = dataUrl;
  img.style.display = 'block';
  const fav = document.getElementById('favicon');
  if (fav) fav.href = dataUrl;
}

window.removeLogo = function() {
  const img = document.getElementById('logoImg');
  img.src = '';
  img.style.display = 'none';
  const fav = document.getElementById('favicon');
  if (fav) fav.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💨</text></svg>";
  document.getElementById('logoFile').value = '';
  document.getElementById('logoPreview').style.display = 'none';
  newLogoBase64 = '';
  showToast('🖼️ Логотип убран (не забудь сохранить)');
};

window.previewLogo = async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    showToast('⏳ Обработка...');
    newLogoBase64 = await compressImage(file, 400, 0.9);
    const img = document.getElementById('logoPreview');
    img.src = newLogoBase64;
    img.style.display = 'block';
    showToast('✅ Превью готово', 'success');
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  }
};

window.saveLogo = async function() {
  if (!newLogoBase64) {
    showToast('⚠️ Сначала выбери файл', 'error');
    return;
  }
  const btn = document.getElementById('saveLogoBtn');
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    await setDoc(doc(db, 'settings', 'logo'), { imageUrl: newLogoBase64 });
    applyLogo(newLogoBase64);
    newLogoBase64 = '';
    showToast('✅ Логотип сохранён!', 'success');
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Сохранить логотип';
  }
};

async function loadProducts() {
  try {
    setStatus('⏳ Загрузка товаров...');
    const snap = await getDocs(collection(db, 'products'));
    products = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (products.length === 0) {
      setStatus('⚠️ Товаров нет. 3 раза кликни по логотипу VAPORX → введи пароль → добавь товар.', 'err');
      document.getElementById('products').innerHTML = '<div class="loader">Товаров нет.</div>';
      return;
    }
    setStatus(`✅ Загружено ${products.length} товаров`, 'ok');
    renderProducts();
  } catch (err) {
    console.error(err);
    setStatus('❌ Ошибка: ' + err.message, 'err');
  }
}

function renderProducts() {
  const grid = document.getElementById('products');
  grid.innerHTML = products.map(p => `
    <div class="card">
      ${isAdmin ? `<button class="delete-btn" onclick="deleteProduct('${p.id}')" title="Удалить">🗑</button>` : ''}
      <div class="card-img">
        ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : '💨'}
      </div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-desc">${p.desc || ''}</div>
        <div class="card-price">${p.price} MDL</div>
        <button class="add-btn" onclick="addToCart('${p.id}')">В корзину</button>
      </div>
    </div>
  `).join('');
}

window.addToCart = function(id) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty++;
  else {
    const p = products.find(p => p.id === id);
    if (!p) return;
    cart.push({ id: p.id, name: p.name, price: p.price, imageUrl: p.imageUrl, qty: 1 });
  }
  saveCart();
  showToast('✅ Товар добавлен', 'success');
};

window.removeFromCart = function(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
};

function saveCart() {
  localStorage.setItem('vape_cart', JSON.stringify(cart));
  renderCart();
  updateCount();
}

function updateCount() {
  document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
}

function renderCart() {
  const box = document.getElementById('cartItems');
  if (cart.length === 0) {
    box.innerHTML = '<div class="empty">Корзина пуста</div>';
    document.getElementById('cartTotal').textContent = '0 MDL';
    return;
  }
  box.innerHTML = cart.map(i => `
    <div class="cart-item">
      <div class="cart-item-info">
        ${i.name}
        <small>${i.qty} × ${i.price} MDL</small>
      </div>
      <button class="remove-btn" onclick="removeFromCart('${i.id}')">✕</button>
    </div>
  `).join('');
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById('cartTotal').textContent = total + ' MDL';
}

window.toggleCart = function() {
  document.getElementById('cartPanel').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
};

window.checkout = async function() {
  if (cart.length === 0) { showToast('Корзина пуста', 'error'); return; }
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true; btn.textContent = '⏳ Отправка...';
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  try {
    await addDoc(collection(db, 'orders'), {
      items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
      total, currency: 'MDL',
      createdAt: serverTimestamp(), status: 'new'
    });
    showToast(`✅ Заказ на ${total} MDL оформлен!`, 'success');
    cart = []; saveCart(); toggleCart();
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Оформить заказ';
  }
};

window.openAdmin = function() {
  if (isAdmin) {
    document.getElementById('adminModal').classList.add('show');
  } else {
    document.getElementById('loginModal').classList.add('show');
    setTimeout(() => document.getElementById('adminPassword').focus(), 100);
  }
};

window.checkPassword = function() {
  const pwd = document.getElementById('adminPassword').value;
  if (pwd === ADMIN_PASSWORD) {
    isAdmin = true;
    sessionStorage.setItem('isAdmin', '1');
    closeModal('loginModal');
    document.getElementById('adminPassword').value = '';
    showToast('✅ Добро пожаловать, админ!', 'success');
    renderProducts();
    setTimeout(() => openAdmin(), 300);
  } else {
    showToast('❌ Неверный пароль', 'error');
  }
};

window.closeModal = function(id) {
  document.getElementById(id).classList.remove('show');
};

window.switchTab = function(tabId, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
};

window.previewImage = async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    showToast('⏳ Сжатие фото...');
    compressedImageBase64 = await compressImage(file);
    const img = document.getElementById('preview');
    img.src = compressedImageBase64;
    img.style.display = 'block';
    const sizeKB = Math.round(compressedImageBase64.length / 1024);
    showToast(`✅ Фото готово (${sizeKB} KB)`, 'success');
  } catch (err) {
    showToast('❌ Ошибка фото: ' + err.message, 'error');
  }
};

window.saveProduct = async function() {
  const name = document.getElementById('pName').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  const price = parseFloat(document.getElementById('pPrice').value);

  if (!name || isNaN(price)) {
    showToast('⚠️ Заполни название и цену', 'error');
    return;
  }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    await addDoc(collection(db, 'products'), {
      name, desc, price,
      imageUrl: compressedImageBase64 || '',
      createdAt: serverTimestamp()
    });
    showToast('✅ Товар добавлен!', 'success');
    document.getElementById('pName').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pImage').value = '';
    document.getElementById('preview').style.display = 'none';
    compressedImageBase64 = '';
    await loadProducts();
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Добавить товар';
  }
};

window.deleteProduct = async function(id) {
  if (!confirm('Удалить этот товар?')) return;
  try {
    await deleteDoc(doc(db, 'products', id));
    showToast('🗑 Товар удалён', 'success');
    await loadProducts();
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  }
};

let toastTimer;
window.showToast = function(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
};

renderCart();
updateCount();
loadLogo();
loadProducts();
</script>
</body>
</html>
