<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAPORX — Жидкости для вейпа</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💨</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
html { scroll-behavior: smooth; }
body {
  background: #0a0a0f;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(233,69,96,0.12), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(0,224,164,0.08), transparent 45%);
  background-attachment: fixed;
  color: #eee;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== Шапка ===== */
header {
  background: rgba(15,15,22,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 16px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(233,69,96,0.25);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.logo {
  font-size: 26px;
  font-weight: 900;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: 0.3s;
  letter-spacing: 3px;
}
.logo:hover { transform: scale(1.03); }
.logo img {
  height: 42px; width: 42px;
  object-fit: cover;
  border-radius: 10px;
  border: 2px solid #e94560;
  box-shadow: 0 0 20px rgba(233,69,96,0.5);
}
.logo-text {
  background: linear-gradient(135deg, #e94560 0%, #ff5c77 50%, #ff8a9b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(233,69,96,0.4);
}
.header-actions { display: flex; gap: 10px; }
.btn {
  color: white;
  border: none;
  padding: 11px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.cart-btn {
  background: linear-gradient(135deg, #e94560, #c73550);
  box-shadow: 0 4px 15px rgba(233,69,96,0.4);
}
.cart-btn:hover {
  background: linear-gradient(135deg, #ff5c77, #e94560);
  box-shadow: 0 6px 25px rgba(233,69,96,0.6);
  transform: translateY(-2px);
}

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 60px 20px 30px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -50%; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(233,69,96,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.hero h1 {
  font-size: clamp(32px, 6vw, 56px);
  font-weight: 900;
  margin-bottom: 12px;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #fff 0%, #e94560 60%, #ff5c77 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  position: relative;
  z-index: 1;
}
.hero p {
  color: #8a8a99;
  font-size: 17px;
  max-width: 500px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(233,69,96,0.12);
  border: 1px solid rgba(233,69,96,0.3);
  color: #ff8a9b;
  padding: 6px 16px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}
/* ===== Контейнер ===== */
.container { max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px; }
.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
  font-size: 22px;
  color: #fff;
}
.section-title::before {
  content: '';
  width: 4px; height: 24px;
  background: linear-gradient(180deg, #e94560, #ff5c77);
  border-radius: 4px;
  box-shadow: 0 0 12px rgba(233,69,96,0.6);
}

/* ===== Сетка товаров ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 22px;
}
.card {
  background: linear-gradient(160deg, #1a1a2e 0%, #16162a 100%);
  border-radius: 18px;
  overflow: hidden;
  transition: 0.35s cubic-bezier(0.4,0,0.2,1);
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 18px;
  padding: 1px;
  background: linear-gradient(135deg, transparent, rgba(233,69,96,0.5), transparent);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: 0.35s;
  pointer-events: none;
}
.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 45px rgba(233,69,96,0.25), 0 0 30px rgba(233,69,96,0.15);
  border-color: rgba(233,69,96,0.4);
}
.card:hover::before { opacity: 1; }
.card-img {
  height: 210px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
  overflow: hidden;
  position: relative;
}
.card-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.4) 100%);
  pointer-events: none;
}
.card-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: 0.5s;
}
.card:hover .card-img img { transform: scale(1.08); }
.card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #fff;
  line-height: 1.3;
}
.card-desc {
  font-size: 12.5px;
  color: #7d8291;
  margin-bottom: 14px;
  line-height: 1.4;
}
.card-price {
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 14px;
  background: linear-gradient(135deg, #e94560, #ff5c77);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-top: auto;
}
.card-price::after { content: ' MDL'; font-size: 13px; color: #7d8291; -webkit-text-fill-color: #7d8291; }
.add-btn {
  background: linear-gradient(135deg, #e94560, #c73550);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  transition: 0.25s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  letter-spacing: 0.3px;
}
.add-btn:hover {
  background: linear-gradient(135deg, #ff5c77, #e94560);
  box-shadow: 0 6px 20px rgba(233,69,96,0.5);
  transform: translateY(-2px);
}
.add-btn:active { transform: translateY(0); }
.delete-btn {
  position: absolute;
  top: 10px; right: 10px;
  background: rgba(231,76,60,0.95);
  color: white;
  border: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 15px;
  z-index: 10;
  transition: 0.25s;
  box-shadow: 0 4px 12px rgba(231,76,60,0.5);
}
.delete-btn:hover {
  background: #e74c3c;
  transform: scale(1.15) rotate(10deg);
}

/* ===== Пустое состояние ===== */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  position: relative;
}
.empty-state-icon {
  font-size: 90px;
  margin-bottom: 20px;
  display: inline-block;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(233,69,96,0.4));
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
.empty-state h3 {
  font-size: 24px;
  color: #fff;
  margin-bottom: 10px;
  font-weight: 700;
}
.empty-state p {
  color: #7d8291;
  font-size: 15px;
  max-width: 400px;
  margin: 0 auto 24px;
  line-height: 1.6;
}
.empty-state-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(233,69,96,0.15);
  border: 1px solid rgba(233,69,96,0.4);
  color: #ff8a9b;
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s;
}
.empty-state-btn:hover {
  background: rgba(233,69,96,0.25);
  transform: translateY(-2px);
}

/* ===== Скелетон загрузки ===== */
.skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 22px;
  width: 100%;
}
.skeleton {
  background: linear-gradient(160deg, #1a1a2e, #16162a);
  border-radius: 18px;
  height: 360px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.05);
}
.skeleton::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(233,69,96,0.08), transparent);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
  }
/* ===== Корзина ===== */
.cart-panel {
  position: fixed;
  right: -460px;
  top: 0;
  width: 420px;
  height: 100%;
  background: linear-gradient(180deg, #14141f 0%, #0f0f18 100%);
  box-shadow: -10px 0 50px rgba(0,0,0,0.8);
  transition: 0.4s cubic-bezier(0.4,0,0.2,1);
  z-index: 200;
  display: flex;
  flex-direction: column;
  border-left: 1px solid rgba(233,69,96,0.3);
}
.cart-panel.open { right: 0; }
.cart-header {
  padding: 22px 24px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.cart-header h3 { color: #fff; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.close-btn {
  background: rgba(255,255,255,0.06);
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  width: 36px; height: 36px;
  border-radius: 10px;
  transition: 0.25s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.close-btn:hover { background: rgba(233,69,96,0.3); transform: rotate(90deg); }
.cart-items { flex: 1; overflow-y: auto; padding: 16px; }
.cart-items::-webkit-scrollbar { width: 6px; }
.cart-items::-webkit-scrollbar-track { background: transparent; }
.cart-items::-webkit-scrollbar-thumb { background: rgba(233,69,96,0.4); border-radius: 3px; }
.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  margin-bottom: 10px;
  transition: 0.25s;
}
.cart-item:hover { background: rgba(233,69,96,0.08); border-color: rgba(233,69,96,0.3); }
.cart-item-info { font-size: 14px; color: #fff; font-weight: 600; flex: 1; }
.cart-item-info small { color: #7d8291; display: block; margin-top: 4px; font-weight: 400; }
.remove-btn {
  background: rgba(233,69,96,0.15);
  color: #ff8a9b;
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}
.remove-btn:hover { background: #e94560; color: white; }
.cart-footer {
  padding: 22px 24px;
  border-top: 1px solid rgba(255,255,255,0.06);
  background: linear-gradient(180deg, #16213e, #14141f);
}
.total {
  font-size: 20px;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #b5b9c4;
}
.total span:last-child {
  background: linear-gradient(135deg, #e94560, #ff5c77);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
  font-size: 24px;
}
.total span:last-child::after { content: ' MDL'; font-size: 14px; -webkit-text-fill-color: #7d8291; }
.checkout-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #e94560, #c73550);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
  transition: 0.3s;
  box-shadow: 0 8px 25px rgba(233,69,96,0.4);
}
.checkout-btn:hover {
  background: linear-gradient(135deg, #ff5c77, #e94560);
  box-shadow: 0 10px 35px rgba(233,69,96,0.6);
  transform: translateY(-2px);
}
.checkout-btn:disabled { background: #444; cursor: not-allowed; box-shadow: none; transform: none; }
.empty-cart {
  text-align: center;
  padding: 80px 20px;
  color: #666;
}
.empty-cart-icon { font-size: 70px; opacity: 0.4; margin-bottom: 15px; display: block; }

/* ===== Overlay ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 150;
}
.overlay.show { opacity: 1; pointer-events: all; }

/* ===== Модалки ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
  overflow-y: auto;
}
.modal.show { display: flex; animation: fadeIn 0.25s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: linear-gradient(160deg, #1a1a2e, #14141f);
  border-radius: 20px;
  padding: 32px;
  width: 100%;
  max-width: 520px;
  border: 1px solid rgba(233,69,96,0.3);
  box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(233,69,96,0.15);
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-box h3 {
  margin-bottom: 22px;
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(135deg, #e94560, #ff5c77);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  margin-bottom: 8px;
  color: #b5b9c4;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.form-group input, .form-group textarea {
  width: 100%;
  padding: 13px 15px;
  background: rgba(0,0,0,0.4);
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  transition: 0.25s;
  font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus {
  outline: none;
  border-color: #e94560;
  background: rgba(233,69,96,0.05);
  box-shadow: 0 0 0 4px rgba(233,69,96,0.15);
}
.form-group input[type="file"] {
  padding: 10px;
  cursor: pointer;
  font-size: 13px;
}
.form-group input[type="file"]::file-selector-button {
  background: rgba(233,69,96,0.2);
  color: #ff8a9b;
  border: 1px solid rgba(233,69,96,0.4);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  margin-right: 12px;
  transition: 0.2s;
}
.form-group input[type="file"]::file-selector-button:hover {
  background: rgba(233,69,96,0.35);
}
.form-actions { display: flex; gap: 12px; margin-top: 24px; }
.form-actions button {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  transition: 0.25s;
  letter-spacing: 0.3px;
}
.btn-primary {
  background: linear-gradient(135deg, #e94560, #c73550);
  color: white;
  box-shadow: 0 6px 20px rgba(233,69,96,0.4);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #ff5c77, #e94560);
  box-shadow: 0 8px 28px rgba(233,69,96,0.6);
  transform: translateY(-2px);
}
.btn-primary:disabled { background: #444; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: #b5b9c4;
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-secondary:hover { background: rgba(255,255,255,0.12); color: #fff; }

/* ===== Табы ===== */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  padding: 5px;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.06);
}
.tab {
  flex: 1;
  padding: 10px 16px;
  background: none;
  border: none;
  color: #7d8291;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  transition: 0.25s;
}
.tab.active {
  background: linear-gradient(135deg, #e94560, #c73550);
  color: white;
  box-shadow: 0 4px 15px rgba(233,69,96,0.4);
}
.tab:not(.active):hover { background: rgba(255,255,255,0.06); color: #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.25s; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: linear-gradient(135deg, #e94560, #c73550);
  color: white;
  padding: 14px 28px;
  border-radius: 12px;
  transition: 0.35s cubic-bezier(0.4,0,0.2,1);
  z-index: 999;
  opacity: 0;
  max-width: 90%;
  font-weight: 600;
  box-shadow: 0 10px 40px rgba(233,69,96,0.5);
  font-size: 14px;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success {
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  box-shadow: 0 10px 40px rgba(46,204,113,0.5);
  color: white;
}
.toast.error {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  box-shadow: 0 10px 40px rgba(231,76,60,0.5);
}

/* ===== Превью ===== */
.preview-img {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 12px;
  margin-top: 12px;
  display: none;
  border: 1.5px solid rgba(233,69,96,0.3);
}
.logo-preview {
  width: 90px; height: 90px;
  object-fit: cover;
  border-radius: 14px;
  margin-top: 12px;
  display: none;
  background: #0f0f14;
  border: 2px solid rgba(233,69,96,0.4);
  box-shadow: 0 0 20px rgba(233,69,96,0.3);
}

/* ===== Футер ===== */
footer {
  text-align: center;
  padding: 40px 20px;
  border-top: 1px solid rgba(255,255,255,0.05);
  color: #555;
  font-size: 13px;
  margin-top: 40px;
}
footer strong { color: #e94560; }

/* ===== Адаптив ===== */
@media (max-width: 600px) {
  .cart-panel { width: 100%; right: -100%; }
  header { padding: 14px 18px; }
  .logo { font-size: 20px; letter-spacing: 2px; }
  .logo img { height: 34px; width: 34px; }
  .btn { padding: 9px 16px; font-size: 14px; }
  .hero { padding: 40px 20px 20px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .card-img { height: 150px; font-size: 60px; }
  .card-body { padding: 14px; }
  .card-title { font-size: 14px; }
  .card-price { font-size: 18px; }
  .add-btn { padding: 10px; font-size: 13px; }
  .modal-box { padding: 22px; }
}
</style>
</head>
<body>
<header>
  <div class="logo" id="shopLogo" title="">
    <img id="logoImg" style="display:none;" alt="logo">
    <span class="logo-text">VAPORX</span>
  </div>
  <div class="header-actions">
    <button class="btn cart-btn" onclick="toggleCart()">🛒 Корзина (<span id="cartCount">0</span>)</button>
  </div>
</header>

<div class="hero">
  <div class="hero-badge">⚡ Более 500 вкусов</div>
  <h1>Жидкости для вейпа</h1>
  <p>Премиальные вкусы, POD-системы и аксессуары. Доставка по всей Молдове.</p>
</div>

<div class="container">
  <div class="section-title" id="sectionTitle">Каталог товаров</div>
  <div class="grid" id="products">
    <div class="skeleton-grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</div>

<footer>
  © 2025 <strong>VAPORX</strong> · Только для лиц старше 18 лет
</footer>

<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>🛒 Корзина</h3>
    <button class="close-btn" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="total"><span>Итого:</span><span id="cartTotal">0</span></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Оформить заказ</button>
  </div>
</div>
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>🔐 Вход в админку</h3>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="adminPassword" placeholder="Введите пароль" onkeydown="if(event.key==='Enter')checkPassword()">
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal('loginModal')">Отмена</button>
      <button class="btn-primary" onclick="checkPassword()">Войти</button>
    </div>
  </div>
</div>

<div class="modal" id="adminModal">
  <div class="modal-box">
    <h3>⚙️ Админ-панель</h3>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('tab-product', this)">📦 Товар</button>
      <button class="tab" onclick="switchTab('tab-logo', this)">🖼️ Логотип</button>
    </div>
    <div class="tab-content active" id="tab-product">
      <div class="form-group">
        <label>Название *</label>
        <input type="text" id="pName" placeholder="Ice Cool Mint">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <input type="text" id="pDesc" placeholder="Ментол • 30мл • 20мг">
      </div>
      <div class="form-group">
        <label>Цена, MDL *</label>
        <input type="number" id="pPrice" placeholder="250" min="0">
      </div>
      <div class="form-group">
        <label>Фото товара с устройства</label>
        <input type="file" id="pImage" accept="image/*" onchange="previewImage(event)">
        <img id="preview" class="preview-img">
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="closeModal('adminModal')">Закрыть</button>
        <button class="btn-primary" id="saveBtn" onclick="saveProduct()">💾 Добавить</button>
      </div>
    </div>
    <div class="tab-content" id="tab-logo">
      <div class="form-group">
        <label>Логотип магазина (PNG, JPG)</label>
        <input type="file" id="logoFile" accept="image/*" onchange="previewLogo(event)">
        <img id="logoPreview" class="logo-preview">
        <small style="color:#666;display:block;margin-top:8px;font-size:12px;">Квадратное фото ~200×200px</small>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="removeLogo()">🗑 Убрать</button>
        <button class="btn-primary" id="saveLogoBtn" onclick="saveLogo()">💾 Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Готово</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, deleteDoc, doc,
  serverTimestamp, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCQe2EbDu2fVV5fskFw1X90eH0MW_GjtM",
  authDomain: "vaporx-ffb81.firebaseapp.com",
  projectId: "vaporx-ffb81",
  storageBucket: "vaporx-ffb81.firebasestorage.app",
  messagingSenderId: "575300685167",
  appId: "1:575300685167:web:2b5324d1ba9d162a0d6c9a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD = 'pip789';
let isAdmin = sessionStorage.getItem('isAdmin') === '1';
let products = [];
let cart = JSON.parse(localStorage.getItem('vape_cart') || '[]');
let logoClickCount = 0;
let logoClickTimer = null;
let compressedImageBase64 = '';
let newLogoBase64 = '';

document.getElementById('shopLogo').addEventListener('click', () => {
  logoClickCount++;
  clearTimeout(logoClickTimer);
  if (logoClickCount >= 3) {
    logoClickCount = 0;
    openAdmin();
    return;
  }
  logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 800);
});

function compressImage(file, maxSize = 800, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// ===== Логотип =====
async function loadLogo() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'logo'));
    if (snap.exists() && snap.data().imageUrl) {
      applyLogo(snap.data().imageUrl);
    }
  } catch (e) {
    console.warn('Логотип не загружен:', e);
  }
}

function applyLogo(dataUrl) {
  const img = document.getElementById('logoImg');
  img.src = dataUrl;
  img.style.display = 'block';
  const fav = document.getElementById('favicon');
  if (fav) fav.href = dataUrl;
}

window.removeLogo = function() {
  const img = document.getElementById('logoImg');
  img.src = '';
  img.style.display = 'none';
  const fav = document.getElementById('favicon');
  if (fav) fav.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💨</text></svg>";
  document.getElementById('logoFile').value = '';
  document.getElementById('logoPreview').style.display = 'none';
  newLogoBase64 = '';
  showToast('🖼️ Логотип убран (не забудь сохранить)');
};

window.previewLogo = async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    showToast('⏳ Обработка...');
    newLogoBase64 = await compressImage(file, 400, 0.9);
    const img = document.getElementById('logoPreview');
    img.src = newLogoBase64;
    img.style.display = 'block';
    showToast('✅ Превью готово', 'success');
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  }
};

window.saveLogo = async function() {
  if (!newLogoBase64) {
    showToast('⚠️ Сначала выбери файл', 'error');
    return;
  }
  const btn = document.getElementById('saveLogoBtn');
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    await setDoc(doc(db, 'settings', 'logo'), { imageUrl: newLogoBase64 });
    applyLogo(newLogoBase64);
    newLogoBase64 = '';
    showToast('✅ Логотип сохранён!', 'success');
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Сохранить';
  }
};

// ===== Товары =====
async function loadProducts() {
  try {
    const snap = await getDocs(collection(db, 'products'));
    products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderProducts();
  } catch (err) {
    console.error(err);
    document.getElementById('products').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <h3>Ошибка загрузки</h3>
        <p>Не удалось подключиться к базе данных</p>
      </div>
    `;
  }
}

function renderProducts() {
  const grid = document.getElementById('products');

  if (products.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">💨</div>
        <h3>Скоро здесь появятся товары</h3>
        <p>Мы готовим для вас лучшие вкусы. Заходите позже!</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = products.map(p => `
    <div class="card">
      ${isAdmin ? `<button class="delete-btn" onclick="deleteProduct('${p.id}')" title="Удалить">🗑</button>` : ''}
      <div class="card-img">
        ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : '💨'}
      </div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-desc">${p.desc || 'Премиальная жидкость'}</div>
        <div class="card-price">${p.price}</div>
        <button class="add-btn" onclick="addToCart('${p.id}')">🛒 В корзину</button>
      </div>
    </div>
  `).join('');
}

// ===== Корзина =====
window.addToCart = function(id) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty++;
  else {
    const p = products.find(p => p.id === id);
    if (!p) return;
    cart.push({ id: p.id, name: p.name, price: p.price, imageUrl: p.imageUrl, qty: 1 });
  }
  saveCart();
  showToast('✅ Товар добавлен', 'success');
};

window.removeFromCart = function(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
};

function saveCart() {
  localStorage.setItem('vape_cart', JSON.stringify(cart));
  renderCart();
  updateCount();
}

function updateCount() {
  document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
}

function renderCart() {
  const box = document.getElementById('cartItems');
  if (cart.length === 0) {
    box.innerHTML = `
      <div class="empty-cart">
        <span class="empty-cart-icon">🛒</span>
        <p>Корзина пуста</p>
      </div>
    `;
    document.getElementById('cartTotal').textContent = '0';
    return;
  }
  box.innerHTML = cart.map(i => `
    <div class="cart-item">
      <div class="cart-item-info">
        ${i.name}
        <small>${i.qty} × ${i.price} MDL</small>
      </div>
      <button class="remove-btn" onclick="removeFromCart('${i.id}')">✕</button>
    </div>
  `).join('');
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById('cartTotal').textContent = total;
}

window.toggleCart = function() {
  document.getElementById('cartPanel').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
};

window.checkout = async function() {
  if (cart.length === 0) { showToast('Корзина пуста', 'error'); return; }
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true; btn.textContent = '⏳ Отправка...';
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  try {
    await addDoc(collection(db, 'orders'), {
      items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
      total, currency: 'MDL',
      createdAt: serverTimestamp(), status: 'new'
    });
    showToast(`✅ Заказ на ${total} MDL оформлен!`, 'success');
    cart = []; saveCart(); toggleCart();
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Оформить заказ';
  }
};

// ===== Админка =====
window.openAdmin = function() {
  if (isAdmin) {
    document.getElementById('adminModal').classList.add('show');
  } else {
    document.getElementById('loginModal').classList.add('show');
    setTimeout(() => document.getElementById('adminPassword').focus(), 100);
  }
};

window.checkPassword = function() {
  const pwd = document.getElementById('adminPassword').value;
  if (pwd === ADMIN_PASSWORD) {
    isAdmin = true;
    sessionStorage.setItem('isAdmin', '1');
    closeModal('loginModal');
    document.getElementById('adminPassword').value = '';
    showToast('✅ Добро пожаловать!', 'success');
    renderProducts();
    setTimeout(() => openAdmin(), 300);
  } else {
    showToast('❌ Неверный пароль', 'error');
  }
};

window.closeModal = function(id) {
  document.getElementById(id).classList.remove('show');
};

window.switchTab = function(tabId, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
};

window.previewImage = async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    showToast('⏳ Сжатие фото...');
    compressedImageBase64 = await compressImage(file);
    const img = document.getElementById('preview');
    img.src = compressedImageBase64;
    img.style.display = 'block';
    const sizeKB = Math.round(compressedImageBase64.length / 1024);
    showToast(`✅ Фото готово (${sizeKB} KB)`, 'success');
  } catch (err) {
    showToast('❌ Ошибка фото: ' + err.message, 'error');
  }
};

window.saveProduct = async function() {
  const name = document.getElementById('pName').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  const price = parseFloat(document.getElementById('pPrice').value);

  if (!name || isNaN(price)) {
    showToast('⚠️ Заполни название и цену', 'error');
    return;
  }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    await addDoc(collection(db, 'products'), {
      name, desc, price,
      imageUrl: compressedImageBase64 || '',
      createdAt: serverTimestamp()
    });
    showToast('✅ Товар добавлен!', 'success');
    document.getElementById('pName').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pImage').value = '';
    document.getElementById('preview').style.display = 'none';
    compressedImageBase64 = '';
    await loadProducts();
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Добавить';
  }
};

window.deleteProduct = async function(id) {
  if (!confirm('Удалить этот товар?')) return;
  try {
    await deleteDoc(doc(db, 'products', id));
    showToast('🗑 Товар удалён', 'success');
    await loadProducts();
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, 'error');
  }
};

let toastTimer;
window.showToast = function(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
};

renderCart();
updateCount();
loadLogo();
loadProducts();
</script>
</body>
</html>
